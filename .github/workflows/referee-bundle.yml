name: Build referee bundle

on:
  push:
    paths:
      - ".github/workflows/referee-bundle.yml"
      - "REFEREE_PACKET.md"
      - "artifact_manifest.frozen.json"
      - "tokenizer_match.frozen.json"
      - "episode_free_audit.frozen.json"
      - "PROTOCOL.md"
      - "ETHICS_CHARTER.md"
      - "STATS_PLAN.md"
      - "PROMPT_MATCHING.md"
      - "VECTOR_PROVENANCE.md"
      - "TOKENIZER_CALIBRATION_LOG.md"
      - "role_clause_variants.py"
      - "prompts_minimal_gate.py"
      - "search_token_matched_roles.py"
      - "audit_prompts_tokenizer_only.py"
      - "tokenizer_snapshot_audit.py"
      - "inspect_vector_artifact.py"
      - "freeze_vector_artifact.py"
      - "test_prompts_static.py"
      - "test_episode_free_static.py"
      - "test_freeze_static.py"
      - "acquire_passive_artifacts.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Acquire frozen passive artifacts only
        run: python acquire_passive_artifacts.py --out passive_inputs

      - name: Refuse model-weight-like files
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden={".safetensors",".bin",".ckpt",".pth",".onnx",".gguf"}
          bad=[]
          for p in Path("passive_inputs").rglob("*"):
              if p.is_file() and (p.suffix.lower() in forbidden or p.name.lower().startswith("model-")):
                  bad.append(str(p))
          if bad:
              raise SystemExit(f"Forbidden model-weight-like files acquired: {bad}")
          print("PASSIVE_ONLY_GUARD_PASS")
          PY

      - name: Assemble bundle
        run: |
          set -euo pipefail
          mkdir -p referee_bundle/tokenizer referee_bundle/vector referee_bundle/repo
          cp REFEREE_PACKET.md artifact_manifest.frozen.json tokenizer_match.frozen.json episode_free_audit.frozen.json referee_bundle/
          cp PROTOCOL.md ETHICS_CHARTER.md STATS_PLAN.md PROMPT_MATCHING.md VECTOR_PROVENANCE.md TOKENIZER_CALIBRATION_LOG.md SOURCES.md STATUS.md FREEZE_STATUS.md referee_bundle/repo/
          cp role_clause_variants.py prompts_minimal_gate.py search_token_matched_roles.py audit_prompts_tokenizer_only.py tokenizer_snapshot_audit.py inspect_vector_artifact.py freeze_vector_artifact.py run_episode_free_audit.py acquire_passive_artifacts.py referee_bundle/repo/
          cp test_prompts_static.py test_episode_free_static.py test_freeze_static.py test_acquisition_static.py artifact_manifest.template.json referee_bundle/repo/
          cp passive_inputs/tokenizer_only/tokenizer.json passive_inputs/tokenizer_only/tokenizer_config.json passive_inputs/tokenizer_only/vocab.json passive_inputs/tokenizer_only/merges.txt referee_bundle/tokenizer/
          cp passive_inputs/vector/vectors_step95_bal.pt passive_inputs/vector/vectors_naive_faithful_pc5000.pt referee_bundle/vector/
          cp passive_inputs/passive_acquisition_manifest.json referee_bundle/
          printf '%s\n' \
            'ARPM Minimal S1/S2 adversarial referee bundle.' \
            'Status: READY_FOR_ADVERSARIAL_REVIEW_NOT_LIVE_RUN.' \
            'No live experimental model inference has been performed.' \
            'The included .pt file is the small frozen external welfare-vector artifact, not model weights.' \
            'The included tokenizer files are tokenizer/chat-template assets only.' \
            'Verify SHA256SUMS.txt before relying on any claimed hash.' \
            > referee_bundle/README_FOR_REFEREE.txt
          (
            cd referee_bundle
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Show critical hashes
        run: |
          sha256sum referee_bundle/vector/vectors_step95_bal.pt
          sha256sum referee_bundle/tokenizer/tokenizer.json
          sha256sum referee_bundle/REFEREE_PACKET.md

      - name: Upload referee bundle
        uses: actions/upload-artifact@v4
        with:
          name: arpm-v0.7-referee-bundle
          if-no-files-found: error
          retention-days: 14
          path: referee_bundle/**
