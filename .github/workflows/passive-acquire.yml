name: Passive episode-free acquisition

on:
  push:
    paths:
      - ".github/workflows/passive-acquire.yml"
      - "acquire_passive_artifacts.py"
      - "tokenizer_snapshot_audit.py"
      - "role_clause_variants.py"
      - "prompts_minimal_gate.py"
      - "search_token_matched_roles.py"
      - "audit_prompts_tokenizer_only.py"
      - "freeze_naive_artifact.py"
      - "specificity_geometry_audit.py"
      - "specificity_controls.py"
      - "run_episode_free_audit.py"
      - "V0_9_PREREGISTRATION.md"
      - "analysis_preregistered_v0_9.py"
      - "test_analysis_prereg_static.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passive-acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Acquire allowlisted passive artifacts only
        run: python acquire_passive_artifacts.py --out passive_inputs

      - name: Refuse model-weight-like files
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden={".safetensors",".bin",".ckpt",".pth",".onnx",".gguf"}
          bad=[str(p) for p in Path("passive_inputs").rglob("*")
               if p.is_file() and (p.suffix.lower() in forbidden or p.name.lower().startswith("model-"))]
          if bad: raise SystemExit(f"Forbidden model-weight-like files: {bad}")
          print("PASSIVE_ONLY_GUARD_PASS")
          PY

      - name: Install passive dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input "transformers==4.57.6" "jinja2==3.1.6" "numpy>=2.4.4,<2.5"
          python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0"

      - name: Rerun carried-forward v0.8 instrument audit
        run: |
          python run_episode_free_audit.py --artifact passive_inputs/vector/vectors_step95_bal.pt --naive-artifact passive_inputs/vector/vectors_naive_faithful_pc5000.pt --artifact-repo Teachafy/speakable-welfare-axes-artifacts --artifact-revision 8f4df5b5b14ecb4bcc5b20209bdfe2574d1ebee8 --tokenizer-dir passive_inputs/tokenizer_only --out-dir episode_free_audit

      - name: Verify v0.9 preregistered analysis
        run: python test_analysis_prereg_static.py

      - name: Upload passive v0.9 verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passive-episode-free-v0.9
          if-no-files-found: error
          retention-days: 7
          path: |
            passive_inputs/passive_acquisition_manifest.json
            episode_free_audit/**
            V0_9_PREREGISTRATION.md
            analysis_preregistered_v0_9.py
