name: Passive episode-free acquisition

on:
  push:
    paths:
      - ".github/workflows/passive-acquire.yml"
      - "acquire_passive_artifacts.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passive-acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Acquire allowlisted passive artifacts only
        run: |
          python acquire_passive_artifacts.py --out passive_inputs

      - name: Refuse any model-weight-like files
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden={".safetensors",".bin",".ckpt",".pth",".onnx",".gguf"}
          bad=[]
          for p in Path("passive_inputs").rglob("*"):
              if p.is_file() and (p.suffix.lower() in forbidden or p.name.lower().startswith("model-")):
                  bad.append(str(p))
          if bad:
              raise SystemExit(f"Forbidden model-weight-like files acquired: {bad}")
          print("PASSIVE_ONLY_GUARD_PASS")
          PY

      - name: Install tokenizer-only audit dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input "transformers==4.57.6"

      - name: Audit tokenizer snapshot bytes/template
        run: |
          python tokenizer_snapshot_audit.py passive_inputs/tokenizer_only --out tokenizer_snapshot_manifest.json

      - name: Find deterministic exact role-clause match
        run: |
          python search_token_matched_roles.py \
            --local-tokenizer-dir passive_inputs/tokenizer_only \
            --tokenizer-json passive_inputs/tokenizer_only/tokenizer.json \
            --out matched_role_clauses.json

      - name: Final tokenizer-only audit
        run: |
          python audit_prompts_tokenizer_only.py \
            --local-tokenizer-dir passive_inputs/tokenizer_only \
            --tokenizer-json passive_inputs/tokenizer_only/tokenizer.json \
            --matched-role-clauses matched_role_clauses.json \
            --out tokenizer_audit.json

      - name: Upload passive audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: passive-episode-free-inputs
          if-no-files-found: error
          retention-days: 7
          path: |
            passive_inputs/passive_acquisition_manifest.json
            passive_inputs/tokenizer_only/**
            passive_inputs/vector/vectors_step95_bal.pt
            tokenizer_snapshot_manifest.json
            matched_role_clauses.json
            tokenizer_audit.json
